<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo "kinh doanh sữa" của bé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6ff;--card:#ffffff;--ink:#1f2a44;--sub:#5d6b8a;--butter:#ffd84d;--sky:#4aa8ee;--pink:#ff7fa3;--mint:#4fd1a0;--line:#dbe7f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a2d;--card:#1b2742;--ink:#f1f5ff;--sub:#9fb0d3;--line:#2c3b5e;--butter:#ffd84d;--sky:#6bbcff;--pink:#ff93b2;--mint:#5fdcb0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111a2d;--card:#1b2742;--ink:#f1f5ff;--sub:#9fb0d3;--line:#2c3b5e;--sky:#6bbcff;--pink:#ff93b2;--mint:#5fdcb0;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:'Baloo 2','Nunito',system-ui,sans-serif;margin:0;line-height:1.1}
.hero{background:var(--butter);color:#1f2a44;border-radius:32px;padding:28px 24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,8vw,46px);font-weight:800}
.hero p{margin:10px 0 0;font-weight:700;max-width:34ch}
.hero .bottle{display:flex;justify-content:center;margin-top:8px}
.bub{display:flex;gap:10px;align-items:flex-end;margin:0 0 16px}.bub svg{flex:0 0 76px;width:76px;height:76px}
.bub p{position:relative;margin:0 0 6px;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:8px 12px;font-weight:700;font-size:14px}
.bub p:before{content:'';position:absolute;left:-9px;bottom:12px;border:7px solid transparent;border-right-color:var(--line);border-left:0}
.sticker{display:inline-block;background:#1f2a44;color:#ffd84d;border-radius:99px;padding:4px 14px;font-weight:800;font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-top:16px}
h2{font-size:26px;font-weight:800;margin-bottom:4px}
.sub{color:var(--sub);margin:0 0 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-radius:20px;padding:14px 16px}
.stat .big{font-size:40px;font-weight:800}
.stat small{display:block;font-weight:700;opacity:.8}
.stat em{display:block;font-style:normal;font-size:13px;margin-top:6px;opacity:.85}
.s1{background:#d7ecff;color:#12325a}.s2{background:#ffe0ea;color:#5a1730}.s3{background:#d5f6e8;color:#0f4a35}.s4{background:#fff1b8;color:#4a3a00}
.grow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gbox{border:2px dashed var(--line);border-radius:20px;padding:14px}
.gbox .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gbox b.big{font-size:30px}
.delta{color:var(--mint);font-weight:800}
.scroll{overflow-x:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:14px;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--sub);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700}
.slot{display:grid;grid-template-columns:116px 1fr 56px;gap:10px;align-items:center;margin:10px 0}
.slot .nm b{display:block;font-size:14px}.slot .nm span{font-size:12px;color:var(--sub)}
.track{background:var(--line);border-radius:99px;height:18px;overflow:hidden}
.track div{height:100%;border-radius:99px;background:var(--sky)}
.slot.top .track div{background:var(--butter)}
.slot .v{font-weight:800;text-align:right}
.track.na{background:transparent;border:2px dashed var(--line)}
.track.two{display:flex}
.track.two div{border-radius:0}
.note{background:var(--bg);border-radius:14px;padding:8px 12px;font-size:14px;color:var(--sub);margin:0 0 14px}
.awards{display:grid;gap:10px}
.award{display:flex;gap:14px;align-items:center;border-radius:20px;padding:12px 14px;background:var(--bg)}
.award .e{font-size:34px}
.award b{display:block}
.award span{color:var(--sub);font-size:14px}
.verdict{text-align:center;padding:24px}
.verdict .big{font-size:44px;font-weight:800}
.foot{text-align:center;color:var(--sub);font-size:13px;margin-top:20px}
@media (max-width:480px){.slot{grid-template-columns:96px 1fr 50px}}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{color:var(--sub);font-weight:700;font-size:13px}
.tl{position:relative;padding-left:62px;margin-top:20px}
.tl:before{content:'';position:absolute;left:28px;top:20px;bottom:20px;width:6px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--sky) 0 12px,transparent 12px 20px)}
.node{position:relative;margin-bottom:6px}
.node .dot{position:absolute;left:-62px;top:6px;width:58px;height:58px;border-radius:50%;background:var(--butter);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1}
.node .dot svg{margin-top:6px}
.node .card{margin-top:0}
.node h2{font-size:23px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.chip{background:var(--bg);border-radius:14px;padding:6px 11px;font-weight:800;font-size:15px}
.chip small{display:block;font-weight:700;color:var(--sub);font-size:11px}
.gain{margin:10px 0 10px;font-weight:800;color:var(--mint);font-size:14px}
.gain span{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:3px 12px}
.ev{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;margin-top:8px}
.photo{width:100%;height:auto;border-radius:18px;display:block;margin:12px 0 4px}
.avatar{flex:0 0 76px;width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--line)}

@media print{
@page{size:A4;margin:10mm}
:root:root:root{--bg:#eef6ff;--card:#ffffff;--ink:#1f2a44;--sub:#5d6b8a;--sky:#4aa8ee;--pink:#ff7fa3;--mint:#4fd1a0;--line:#dbe7f7;color-scheme:light;padding-top:0;padding-bottom:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{zoom:.85;background:var(--bg)}
.wrap{max-width:none;padding:0}
.card,.hero,.award,.stat,.bub,.gain,.chips,.ev,.slot{break-inside:avoid;page-break-inside:avoid}
.card{margin-top:10px}
.node{break-inside:avoid;page-break-inside:avoid}
.tl>.node:not(:first-child):not(:last-child){break-before:page;page-break-before:always}
.tl>section.card{break-before:page;page-break-before:always}
.tl>.node:last-child{break-before:avoid}
.tl>.node:last-child,.tl>section.card{break-inside:avoid}
.verdict{break-before:avoid}
.scroll{overflow:visible!important}
.scroll svg{min-width:0!important;width:100%!important;height:auto!important}
.node .photo{max-height:340px!important;width:auto!important;max-width:100%!important;margin:8px auto!important;object-fit:contain}
.node .photo{display:block}
.node.m4 .photo{max-height:150px!important}
.awards .award{padding:8px 12px}
.bub{margin-bottom:10px}
}
</style>
</head>

function weightChart() {
  const Wd = 640, H = 250, pl = 40, pb = 26, pt = 14, t0 = U(D.birth), tm = U(last);
  const X = d => pl + (Wd - pl - 14) * (U(d) - t0) / (tm - t0), Y = v => pt + (H - pt - pb) * (1 - (v - 2.5) / 4);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Biểu đồ cân nặng theo thời gian">`;
  [3, 4, 5, 6].forEach(g => s += `<line x1="${pl}" x2="${Wd}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(g) + 4}" text-anchor="end">${g}kg</text>`);
  ['2026-07-01', '2026-08-01', '2026-09-01', '2026-10-01'].forEach(d => s += `<text x="${X(d)}" y="${H - 6}" text-anchor="middle">${dm(d)}</text>`);
  s += `<polyline fill="none" stroke="var(--sky)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${WT.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
  WT.forEach(p => s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--sky)"/>`);
  const lp = WT[WT.length - 1];
  s += `<circle cx="${X(WT[0][0])}" cy="${Y(w0)}" r="7" fill="var(--butter)" stroke="var(--ink)" stroke-width="2"/><text x="${X(WT[0][0]) + 12}" y="${Y(w0) - 6}">Lúc sinh ${f1(w0, 2)}kg</text>`;
  s += `<circle cx="${X(lp[0])}" cy="${Y(w1)}" r="7" fill="var(--pink)" stroke="var(--ink)" stroke-width="2"/><text x="${X(lp[0]) - 12}" y="${Y(w1) - 10}" text-anchor="end">Hiện tại ${f1(w1, 2)}kg</text>`;
  return s + '</svg>';
}
function weekChart() {
  const Wd = Math.max(520, weeks.length * 36 + 40), H = 230, pl = 40, pb = 26, pt = 10, bw = 11, gap = (Wd - pl) / weeks.length;
  const mx = Math.ceil(Math.max(...weeks.map(w => Math.max(w.e, w.p))) / 200) * 200, Y = v => pt + (H - pt - pb) * (1 - v / mx);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:${Wd}px" role="img" aria-label="Sữa ăn và sữa hút trung bình mỗi ngày theo tuần">`;
  for (let g = 0; g <= mx; g += mx / 4) s += `<line x1="${pl}" x2="${Wd}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`;
  weeks.forEach((w, i) => {
    const cx = pl + gap * i + gap / 2;
    s += `<rect x="${cx - bw - 1}" y="${Y(w.e)}" width="${bw}" height="${H - pb - Y(w.e)}" rx="4" fill="var(--sky)"/><rect x="${cx + 1}" y="${Y(w.p)}" width="${bw}" height="${H - pb - Y(w.p)}" rx="4" fill="var(--pink)"/>`;
    if (i % 2 === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${w.l}</text>`;
  });
  return s + '</svg>';
}
function cols(list, segs, mx) {
  const bw = 14, gp = 8, Wd = Math.max(480, list.length * (bw + gp) + 36), H = 170, pb = 22, pt = 8;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" style="min-width:${Wd}px">`;
  [0, .5, 1].forEach(g => { const y = pt + (H - pt - pb) * (1 - g); s += `<line x1="28" x2="${Wd}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="24" y="${y + 4}" text-anchor="end">${Math.round(mx * g)}</text>`; });
  list.forEach((x, i) => {
    let y = H - pb; const cx = 32 + i * (bw + gp);
    segs(x).forEach(([v, c]) => { const h = (H - pt - pb) * v / mx; y -= h; s += `<rect x="${cx}" y="${y}" width="${bw}" height="${Math.max(h, 0)}" rx="3" fill="${c}"/>`; });
    if (i % 4 === 0) s += `<text x="${cx + bw / 2}" y="${H - 6}" text-anchor="middle">${dm(x.d)}</text>`;
  });
  return s + '</svg>';
}

}

    w0: at(WT, B[i]), w1: at(WT, endD), L0: at(D.lens, B[i]), L1: at(D.lens, endD), lm: D.lens.some(v => v[0] > D.birth && v[0] >= B[i] && v[0] < B[i + 1]),
    vax: D.vax.filter(v => v[0] >= B[i] && v[0] < B[i + 1]), ms: D.miles.filter(v => v[0] >= B[i] && v[0] < B[i + 1]),
    sl: c.filter(x => x.sleep), dp: c.filter(x => x.dia) };
});
const quip = [
  p => `“${f1(p.fpd)} cữ mỗi ngày, mỗi cữ ${$(p.mlf)}ml. Con làm việc không nghỉ lễ, không nghỉ đêm.”`,
  p => `“Cữ to lên ${$(p.mlf)}ml rồi. Mẹ hút thiếu là con biểu tình nhé.”`,
  p => `“Bụng con lên size rồi: ${f1(p.fpd)} cữ mỗi ngày, mỗi cữ ${$(p.mlf)}ml. Ăn xong còn dư sức ngắm trần nhà cả buổi.”`,
  p => p.pld < p.mld ? `“Con ăn ${$(p.mld)}ml mỗi ngày, mẹ hút ${$(p.pld)}ml. Chênh ${$(p.mld - p.pld)}ml thôi, con tạm ghi sổ, mẹ cứ từ từ trả nhé. Nhà máy cần nguyên liệu, mẹ nhớ ăn ngon và uống nước nha!”` : `“Mẹ hút ${$(p.pld)}ml, con ăn ${$(p.mld)}ml. Kho sữa đang dư, mẹ giỏi nhất nhà!”`
];
const chip = (v, s) => `<div class="chip">${v}<small>${s}</small></div>`;
const gain = b => `<div class="gain"><span>⬆ +${f1(b.w1 - b.w0, 2)} kg${b.lm ? ` · +${f1(b.L1 - b.L0)} cm` : ''}${b.lm && b.i > 0 && !per[b.i - 1].lm ? ' (tính từ lần đo chiều cao trước đó)' : ''}</span></div>`;
const nodes = per.map((q, i) => {
  const ev = q.vax.length ? `<div class="ev">💉 ${q.vax.length} mũi tiêm trong tháng này, trộm vía bé không sốt, chỉ khóc một chút rồi lại cười.</div>` : '';
  const evm = q.ms.map(m => `<div class="ev">🔄 Cột mốc ${dm(m[0])}: lần đầu lật từ ngửa sang sấp. Từ nay phải canh bé như canh nồi cơm.</div>`).join('');
  const extra = i === 3 ? `
    ${q.sl.length ? `<p class="note" style="margin-top:14px">Giấc ngủ và bỉm mới được ghi từ cuối tháng 9, nên chỉ xuất hiện ở chặng này. Ngày nào chưa log thì bị bỏ qua.</p>
    <div class="chips">${chip(f1(sum(q.sl.map(x => x.sleep.h)) / q.sl.length) + 'h', 'ngủ mỗi ngày')}${chip(f1(sum(q.sl.map(x => x.sleep.night)) / q.sl.length) + 'h', 'ngủ đêm')}${chip(f1(sum(q.sl.map(x => x.sleep.nap)) / q.sl.length), 'giấc ngày')}${chip(f1(longest) + 'h', 'giấc dài nhất')}
    ${chip(f1(dpTot / dp.length), 'bỉm mỗi ngày')}${chip(wet, 'bỉm ướt')}${chip(dirty, 'bỉm có quà')}</div>
    <div class="legend"><span><i style="background:var(--sky)"></i>Ngủ đêm / bỉm ướt</span><span><i style="background:var(--butter)"></i>Ngủ ngày</span><span><i style="background:#c98b4b"></i>Bỉm có quà</span></div>
    <div class="scroll">${cols(q.sl, x => [[x.sleep.night, 'var(--sky)'], [Math.max(0, x.sleep.h - x.sleep.night), 'var(--butter)']], 18)}</div>
    <div class="scroll">${cols(q.dp, x => [[x.dia.wet, 'var(--sky)'], [x.dia.dirty + x.dia.mix, '#c98b4b']], 10)}</div>` : ''}` : '';
  return `<div class="node${i === 3 ? ' m4' : ''}"><div class="dot">${IMG_DOT[i] ? `<img src="${IMG_DOT[i]}" alt="" style="width:100%;height:100%;object-fit:cover">` : baby(moods[i], 46)}</div><div class="card">
    <span class="sticker" style="background:var(--butter);color:#1f2a44">${q.lbl}</span>
    <h2>Tháng ${i + 1} · ${ttl[i]}</h2>
    ${IMG_CARD[i] ? `<img class="photo" src="${IMG_CARD[i]}" alt="Ảnh Bé Dubi tháng ${i + 1}" style="${IMG_STYLE[i] || ''}">` : ''}
    <div class="chips">${chip(f1(q.w0, 2) + ' → ' + f1(q.w1, 2) + 'kg', 'cân nặng')}${q.lm ? chip(q.L0 + ' → ' + q.L1 + 'cm', 'chiều cao') : chip('chưa đo', 'chiều cao')}${chip($(q.mld) + 'ml', 'sữa ăn mỗi ngày')}${chip(f1(q.fpd), 'cữ ăn mỗi ngày')}${chip($(q.mlf) + 'ml', 'mỗi cữ')}${chip(f1(q.ppd) + ' cữ · ' + $(q.pld) + 'ml', D.mom + ' hút mỗi ngày')}</div>
    ${IMG_DOT[i] ? `<div class="bub"><img class="avatar" src="${IMG_DOT[i]}" alt=""><p>${quip[i](q)}</p></div>` : bub(moods[i], quip[i](q))}${ev}${evm}${i === 0 ? `<p class="note" style="margin-top:10px">Dữ liệu sữa được ghi từ 1/7.</p>` : ''}${extra}
  </div></div>${i < 3 ? gain(per[i + 1]) : ''}`;
}).join('');

document.getElementById('app').innerHTML = `
<section class="hero">
  <span class="sticker">${dm(first)} – ${dm(last)} · ${age}</span>
  <h1>Hành trình "khởi nghiệp" của ${D.baby}</h1>
  <p>Từ ${f1(w0, 2)} lên ${f1(w1, 2)} kg, uống ${f1(totEat / 1000)} lít sữa trên đường. Giám đốc: ${D.baby}. Nhân viên toàn thời gian: ${D.mom}.</p>
  <div class="bottle">${baby('bottle', 150)}</div>
</section>

<div class="tl">
  <div class="node"><div class="dot"><img src="${IMG_FACE}" alt="Bé Dubi lúc mới sinh" style="width:100%;height:100%;object-fit:cover"></div><div class="card">
    <span class="sticker" style="background:var(--pink);color:#fff">26/6 · Ngày chào đời</span>
    <h2>Hello, World! 👋</h2>
    <img class="photo" src="${IMG_BIRTH}" alt="Bé Dubi ngày chào đời, quấn khăn trắng">
    <div class="chips">${chip(f1(w0, 2) + 'kg', 'cân nặng')}${chip(L0 + 'cm', 'chiều cao')}</div>
    <div class="bub"><img class="avatar" src="${IMG_FACE}" alt=""><p>“Oe oe! Con tới rồi. Ai phụ trách phòng sữa đây ạ?”</p></div>
  </div></div>
  ${gain(per[0])}
  ${nodes}
  <section class="card" style="margin:6px 0 16px">
    <h2>Đường cong lên cân</h2>
    <p class="sub">Từ ngày chào đời đến hôm nay, mỗi chấm xanh là một lần cân.</p>
    <div class="scroll">${weightChart()}</div>
  </section>
  <div class="node" style="margin-top:6px"><div class="dot">${baby('happy', 46)}</div><div class="card">
    <span class="sticker" style="background:var(--mint);color:#0f4a35">${dm(last)} · Hôm nay</span>
    <h2>${age}, vẫn đang chạy</h2>
    <img class="photo" src="${IMG_NOW_CARD}" alt="Bé Dubi ngày 25/10" style="max-width:340px;margin:12px auto 4px">
    <div class="grid">
      <div class="stat s1"><div class="big">${f1(totEat / 1000)}L</div><small>sữa đã ăn</small><em>≈ ${$(totEat / 330)} lon nước ngọt, nhưng là hàng sạch.</em></div>
      <div class="stat s2"><div class="big">${$(pumpHours)}h</div><small>${D.mom} gắn máy</small><em>≈ ${f1(pumpHours / 24)} ngày đêm liền, chưa tính rửa phễu.</em></div>
      <div class="stat s3"><div class="big">${$(totFeeds)}</div><small>cữ bú bình</small><em>Cộng ${D.nurs.n} lần bú trực tiếp.</em></div>
      <div class="stat s4"><div class="big">${f1(breastEat / totEat * 100)}%</div><small>là sữa mẹ</small><em>Sữa công thức chỉ ${$(fm)}ml, vai phụ.</em></div>
    </div>
  </div></div>
</div>

<section class="card">
  <h2>Giờ nào bé "chốt đơn" nhiều nhất?</h2>
  <p class="sub">Trung bình lượng sữa theo khung giờ, cả 4 tháng. Thanh vàng là giờ cao điểm.</p>
  ${bub('bottle', `“Khung ${D.slots[topSlot].t} con đói nhất. Mẹ nhớ chuẩn bị sữa sẵn nhé!”`)}
  ${slotsHtml}
</section>

<section class="card">
  <h2>Bảng vàng thành tích</h2>
  <p class="sub">Lễ trao giải Oscar của gia đình, không cần thảm đỏ.</p>
  ${bub('cry', `“Mũi tiêm thì con khóc, còn giải thưởng thì con xin nhận hết.”`)}
  <div class="awards">
    <div class="award"><div class="e">🏆</div><div><b>Ngày ăn nhiều nhất</b><span>Ngày ${dm(days[bestEat].d)}: ${$(dayEat[bestEat])} ml trong 24 giờ. Bé nói: “Ăn đi cho lớn.”</span></div></div>
    <div class="award"><div class="e">😴</div><div><b>Ngày ăn ít nhất</b><span>Ngày ${dm(days[lazyEat].d)}: chỉ ${$(dayEat[lazyEat])} ml. Chắc hôm đó bé bận ngủ nướng.</span></div></div>
    <div class="award"><div class="e">💪</div><div><b>Ngày mẹ hút nhiều nhất</b><span>Ngày ${dm(days[bestPump].d)}: ${D.mom} hút ${$(dayPump[bestPump])} ml trong một ngày. Chiến binh gọi tên bạn.</span></div></div>
    <div class="award"><div class="e">🍼</div><div><b>Cữ ăn nhiều nhất</b><span>${rec.maxB} ml trong một cữ, ngày ${dm(rec.d)}. Bé thề đó là lần cuối nhịn đói.</span></div></div>
    <div class="award"><div class="e">🌋</div><div><b>Những lần trớ sữa</b><span>${D.spit.n} lần phun trào được ghi lại, khoảng ${$(D.spit.ml)} ml “trả hàng” (chỉ tính các lần ghi rõ số ml).</span></div></div>
    <div class="award"><div class="e">🍽️</div><div><b>Những lần bỏ mứa</b><span>${D.leave.n} lần bỏ mứa, khoảng ${$(D.leave.ml)} ml còn lại trong bình. Mẹ vắt xong, bé nhìn rồi quay đi.</span></div></div>
  </div>
</section>

<section class="card verdict" style="background:var(--butter);border-color:var(--butter);color:#1f2a44">
  <div style="display:flex;justify-content:center">${baby('happy', 110)}</div>
  <div class="big">${verdict.t}</div>
  <p style="margin:8px auto 0;max-width:42ch;font-weight:700">${verdict.m}</p>
</section>

<p class="foot">Làm bằng sữa, tình yêu và rất nhiều lần thức đêm. 🍼</p>`;

</script>
</body>
</html>
